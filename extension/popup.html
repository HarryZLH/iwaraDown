<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #4cc9f0;
    }
    .info {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #3a56d4;
    }
    .btn.secondary {
      background: #495057;
    }
    .btn.secondary:hover {
      background: #343a40;
    }
    .footer {
      margin-top: 16px;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🎬 iwaraDown</h1>
  <div class="info">批量下载 Iwara 视频 - by HarryZhang</div>
  
  <button class="btn" id="openIwara">打开 Iwara</button>
  <button class="btn secondary" id="openSettings">设置</button>
  
  <div class="footer">v1.0 | 按 ESC 关闭设置面板</div>

  <script>
    document.getElementById('openIwara').addEventListener('click', () => {
      chrome.tabs.create({ url: 'https://iwara.tv' });
      window.close();
    });

    document.getElementById('openSettings').addEventListener('click', () => {
      chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
        if (tabs[0] && (tabs[0].url.includes('iwara.tv') || tabs[0].url.includes('iwara.moe'))) {
          chrome.tabs.sendMessage(tabs[0].id, { type: 'openSettings' });
          window.close();
        } else {
          alert('请先打开 iwara.tv 或 iwara.moe 网站');
        }
      });
    });
  </script>
</body>
</html>
